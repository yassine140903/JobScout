[project]
name = "jobscout"
version = "0.1.0"
description = "Local-first, CV-driven job discovery tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pdfplumber>=0.10",
    "python-docx>=1.0",
]

[project.scripts]
jobscout = "jobscout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]