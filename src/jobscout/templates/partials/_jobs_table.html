<!-- Filters -->
<form hx-get="/jobs" hx-target="#jobs-table" hx-trigger="change" hx-swap="innerHTML">
    <input type="hidden" name="profile" value="default">

    <div class="grid">
        <label>
            Min score
            <input type="range" name="min_score" min="0" max="1" step="0.05"
                   value="{{ current_filters.min_score }}"
                   oninput="this.nextElementSibling.textContent = this.value">
            <small>{{ current_filters.min_score }}</small>
        </label>

        <label>
            Source
            <select name="source">
                <option value="">All sources</option>
                {% for s in sources %}
                    <option value="{{ s }}" {{ 'selected' if s == current_filters.source }}>
                        {{ s }}
                    </option>
                {% endfor %}
            </select>
        </label>

        <label>
            Org type
            <select name="org_type">
                <option value="">All types</option>
                <option value="lab" {{ 'selected' if current_filters.org_type == 'lab' }}>Lab</option>
                <option value="startup" {{ 'selected' if current_filters.org_type == 'startup' }}>Startup</option>
                <option value="corporate" {{ 'selected' if current_filters.org_type == 'corporate' }}>Corporate</option>
            </select>
        </label>

        <label>
            Position type
            <select name="position_type">
                <option value="">All positions</option>
                <option value="job" {{ 'selected' if current_filters.position_type == 'job' }}>Job</option>
                <option value="internship" {{ 'selected' if current_filters.position_type == 'internship' }}>Internship</option>
                <option value="freelance" {{ 'selected' if current_filters.position_type == 'freelance' }}>Freelance</option>
            </select>
        </label>

        <label>
            Location
            <input type="text" name="location" placeholder="Filter by location..."
                   value="{{ current_filters.location }}"
                   hx-trigger="keyup changed delay:300ms">
        </label>
    </div>

    <!-- Delisted postings: kept, flagged, and hideable. Off by default —
         a job you can no longer apply to is noise in a ranked list. -->
    <label>
        <input type="checkbox" name="show_delisted" value="true" role="switch"
               {{ 'checked' if show_delisted }}>
        Show delisted
        <small>
            {% if delisted_count %}
                &mdash; {{ delisted_count }} posting{{ 's' if delisted_count != 1 }}
                no longer live at the source
            {% else %}
                &mdash; none found
            {% endif %}
        </small>
    </label>

    <!-- Stretch roles: hidden by default, but never silently -->
    <label>
        <input type="checkbox" name="show_stretch" value="true" role="switch"
               {{ 'checked' if show_stretch }}>
        Show stretch roles
        <small>
            {% if stretch_count %}
                &mdash; {{ stretch_count }} job{{ 's' if stretch_count != 1 }}
                need{{ '' if stretch_count != 1 else 's' }} more years than you have
            {% else %}
                &mdash; none hidden
            {% endif %}
        </small>
    </label>
</form>

<!-- Results count -->
<small>
    {{ jobs | length }} jobs found
    {% if stretch_count and not show_stretch %}
        &middot; <strong>{{ stretch_count }} hidden</strong> as stretch roles
    {% endif %}
</small>

<!-- Table -->
<figure>
<table role="grid">
    <thead>
        <tr>
            <th>Score</th>
            <th>Title</th>
            <th>Company</th>
            <th>Type</th>
            <th>Location</th>
            <th>Source</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        {% for job in jobs %}
        <tr class="job-row"
            hx-get="/jobs/{{ job.id }}"
            hx-target="#job-detail-{{ job.id }}"
            hx-swap="innerHTML"
            hx-trigger="click[window.jobscoutShouldLoad]"
            onclick="jobscoutToggleDetail(this, {{ job.id }})">
            <td>
                {% set score_pct = (job.score * 100) | int %}
                {% if score_pct >= 70 %}
                    <span class="score-badge score-high">{{ score_pct }}%</span>
                {% elif score_pct >= 40 %}
                    <span class="score-badge score-medium">{{ score_pct }}%</span>
                {% else %}
                    <span class="score-badge score-low">{{ score_pct }}%</span>
                {% endif %}
            </td>
            <td>
                {{ job.title }}
                {% if job.is_stretch %}
                    <span class="status-pill" title="Requires more years than your profile has">stretch</span>
                {% endif %}
                {% if job.delisted_at %}
                    <span class="status-pill" title="This posting 404s at the source — it has been taken down">delisted</span>
                {% endif %}
            </td>
            <td>{{ job.company or "—" }}</td>
            <td>
                {% if job.org_type %}
                    <span class="org-pill org-{{ job.org_type }}">{{ job.org_type }}</span>
                {% endif %}
            </td>
            <td>{{ job.location or "—" }}</td>
            <td>{{ job.source }}</td>
            <td>
                {% if job.match_status %}
                    <span class="status-pill status-{{ job.match_status }}">
                        {{ job.match_status }}
                    </span>
                {% else %}
                    <span class="status-pill" style="opacity: 0.4;">—</span>
                {% endif %}
            </td>
        </tr>
        <tr class="detail-row">
            <td colspan="7" id="job-detail-{{ job.id }}"
                hx-on::after-swap="jobscoutRevealDetail(this, {{ job.id }})"></td>
        </tr>
        {% endfor %}

        {% if not jobs %}
        <tr>
            <td colspan="7"><em>No jobs match your filters.</em></td>
        </tr>
        {% endif %}
    </tbody>
</table>
</figure>
